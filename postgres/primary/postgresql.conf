# ============================================
# TBS ERP - PostgreSQL Primary Configuration
# Streaming Replication Settings
# ============================================

# Connection Settings
listen_addresses = '*'
max_connections = 200

# Memory Settings
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 64MB
maintenance_work_mem = 128MB

# WAL (Write-Ahead Logging) Settings
wal_level = replica
max_wal_senders = 3
wal_keep_size = 1024
synchronous_commit = on

# Replication Settings
hot_standby = on
max_replication_slots = 3

# Checkpoints
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# Query Logging
log_statement = 'ddl'
deadlock_timeout = 1s

# Authentication
password_encryption = scram-sha-256

# Performance
random_page_cost = 1.1
effective_io_concurrency = 200
