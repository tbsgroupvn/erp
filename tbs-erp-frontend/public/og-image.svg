<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Content -->
  <rect x="80" y="80" width="1040" height="470" rx="20" fill="white" fill-opacity="0.1"/>

  <!-- Logo -->
  <rect x="120" y="120" width="100" height="100" rx="12" fill="white"/>
  <text x="170" y="185" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#2563EB" text-anchor="middle">TBS</text>

  <!-- Title -->
  <text x="250" y="165" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">TBS ERP System</text>
  <text x="250" y="225" font-family="Arial, sans-serif" font-size="32" fill="white" fill-opacity="0.9">Hệ thống quản lý vận chuyển Trung Quốc - Việt Nam</text>

  <!-- Features -->
  <text x="120" y="320" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.95">✓ Vận chuyển nhanh chóng</text>
  <text x="120" y="370" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.95">✓ Chi phí hợp lý</text>
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.95">✓ Uy tín chuyên nghiệp</text>

  <text x="520" y="320" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.95">✓ Hỗ trợ 24/7</text>
  <text x="520" y="370" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.95">✓ Theo dõi đơn hàng</text>
  <text x="520" y="420" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.95">✓ Bảo hiểm 100%</text>

  <!-- Footer -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle">nhaphangchinhngach.vn</text>
</svg>
