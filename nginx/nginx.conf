# ============================================
# TBS ERP - Nginx Reverse Proxy Configuration
# Domains:
#   erp.nhaphangchinhngach.vn  -> ERP Frontend (port 3000)
#   nhaphangchinhngach.vn      -> CMS Frontend (port 3002)
#   api.nhaphangchinhngach.vn  -> Backend API  (port 3001)
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
                    'cs=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    server_tokens off;

    # Buffer optimization
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;

    # Open file cache for static assets
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ============================================
    # Proxy Cache Zones
    # ============================================
    # Static asset cache: large capacity, long retention
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=7d use_temp_path=off;
    # API response cache: smaller, short-lived
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=500m inactive=5m use_temp_path=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2
        application/wasm;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream definitions with keepalive
    upstream erp_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream cms_frontend {
        server cms:3000;
        keepalive 32;
    }

    upstream backend_api {
        server backend:3000;
        keepalive 64;
    }

    # ============================================
    # HTTP -> HTTPS redirect
    # ============================================
    server {
        listen 80;
        server_name nhaphangchinhngach.vn www.nhaphangchinhngach.vn erp.nhaphangchinhngach.vn api.nhaphangchinhngach.vn;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================
    # ERP Frontend - erp.nhaphangchinhngach.vn
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name erp.nhaphangchinhngach.vn;

        ssl_certificate /etc/letsencrypt/live/nhaphangchinhngach.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nhaphangchinhngach.vn/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        # CSP nonce — use request_id for per-request nonce
        set $csp_nonce $request_id;

        # Security headers (hardened)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.nhaphangchinhngach.vn; font-src 'self' data:; connect-src 'self' https://api.nhaphangchinhngach.vn wss://api.nhaphangchinhngach.vn; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        limit_req zone=web burst=50 nodelay;
        limit_conn addr 100;

        # Next.js static files - immutable, aggressive caching
        location /_next/static/ {
            proxy_pass http://erp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Next.js optimized images
        location /_next/image {
            proxy_pass http://erp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header Cache-Control "public, max-age=2592000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            proxy_pass http://erp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 30d;

            add_header Cache-Control "public, max-age=2592000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            proxy_pass http://erp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 365d;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            add_header Access-Control-Allow-Origin "*";
        }

        location / {
            proxy_pass http://erp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================
    # CMS Frontend - nhaphangchinhngach.vn
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name nhaphangchinhngach.vn www.nhaphangchinhngach.vn;

        ssl_certificate /etc/letsencrypt/live/nhaphangchinhngach.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nhaphangchinhngach.vn/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        # CSP nonce
        set $csp_nonce $request_id;

        # Security headers (hardened)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.nhaphangchinhngach.vn; font-src 'self' data:; connect-src 'self' https://api.nhaphangchinhngach.vn wss://api.nhaphangchinhngach.vn; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        limit_req zone=web burst=50 nodelay;
        limit_conn addr 100;

        # Next.js static files - immutable, aggressive caching
        location /_next/static/ {
            proxy_pass http://cms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Next.js optimized images
        location /_next/image {
            proxy_pass http://cms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header Cache-Control "public, max-age=2592000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            proxy_pass http://cms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 30d;

            add_header Cache-Control "public, max-age=2592000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            proxy_pass http://cms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache static_cache;
            proxy_cache_valid 200 365d;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            add_header Access-Control-Allow-Origin "*";
        }

        location / {
            proxy_pass http://cms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================
    # Backend API - api.nhaphangchinhngach.vn
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name api.nhaphangchinhngach.vn;

        ssl_certificate /etc/letsencrypt/live/nhaphangchinhngach.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nhaphangchinhngach.vn/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        # Security headers (hardened for API)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # CORS headers - handled by NestJS backend (app.enableCors)
        # Removed duplicate CORS headers from Nginx to avoid double headers that browsers reject.
        # The backend sets proper CORS origins via CORS_ORIGINS env var.

        limit_req zone=api burst=30 nodelay;
        limit_conn addr 200;

        # Block /metrics endpoint from external access (internal only for Prometheus)
        location /api/v1/metrics {
            deny all;
            return 403;
        }

        # Dashboard API - nginx-level caching for read-heavy dashboard queries
        location /api/v1/dashboard {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache dashboard responses per-user for 60s
            proxy_cache api_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_key "$request_uri|$http_authorization";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            add_header X-Cache-Status $upstream_cache_status;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Public API endpoints - cacheable at nginx level
        location /api/v1/public {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache api_cache;
            proxy_cache_valid 200 300s;
            proxy_cache_key "$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # Exchange rates - cacheable, changes infrequently
        location /api/v1/exchange-rates {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Only cache GET requests
            proxy_cache api_cache;
            proxy_cache_valid 200 3600s;
            proxy_cache_key "$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_use_stale error timeout updating;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # Backwards compatibility: redirect unversioned /api/ to /api/v1/
        # Matches /api/something but NOT /api/v1/... or /api/v2/... etc.
        location ~ ^/api/(?!v\d+/) {
            rewrite ^/api/(.*)$ /api/v1/$1 permanent;
        }

        # Versioned API endpoint
        location /api/v1/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for long-running API calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check -- accessible without version prefix
        location /api/v1/health {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Health checks can be served stale during outages
            proxy_cache api_cache;
            proxy_cache_valid 200 10s;
            proxy_cache_key "health";
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        }

        # Uploads -- not versioned
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache uploaded files at nginx level
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Default fallback
        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for long-running API calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # ============================================
    # Nginx Stub Status - For Prometheus nginx-exporter
    # Internal only (port 8080, not exposed externally)
    # ============================================
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status on;
            # Only allow internal Docker network access
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            return 404;
        }
    }
}
