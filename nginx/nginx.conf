# ============================================
# TBS ERP - Nginx Reverse Proxy Configuration
# Domains:
#   erp.nhaphangchinhngach.vn  → ERP Frontend (port 3000)
#   nhaphangchinhngach.vn      → CMS Frontend (port 3002)
#   api.nhaphangchinhngach.vn  → Backend API  (port 3001)
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;

    # Upstream definitions
    upstream erp_frontend {
        server frontend:3000;
    }

    upstream cms_frontend {
        server cms:3000;
    }

    upstream backend_api {
        server backend:3000;
    }

    # ============================================
    # HTTP → HTTPS redirect
    # ============================================
    server {
        listen 80;
        server_name nhaphangchinhngach.vn www.nhaphangchinhngach.vn erp.nhaphangchinhngach.vn api.nhaphangchinhngach.vn;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================
    # ERP Frontend - erp.nhaphangchinhngach.vn
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name erp.nhaphangchinhngach.vn;

        ssl_certificate /etc/letsencrypt/live/nhaphangchinhngach.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nhaphangchinhngach.vn/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.nhaphangchinhngach.vn; font-src 'self' data:; connect-src 'self' https://api.nhaphangchinhngach.vn; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        limit_req zone=web burst=50 nodelay;

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://erp_frontend;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://erp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================
    # CMS Frontend - nhaphangchinhngach.vn
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name nhaphangchinhngach.vn www.nhaphangchinhngach.vn;

        ssl_certificate /etc/letsencrypt/live/nhaphangchinhngach.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nhaphangchinhngach.vn/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.nhaphangchinhngach.vn; font-src 'self' data:; connect-src 'self' https://api.nhaphangchinhngach.vn; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        limit_req zone=web burst=50 nodelay;

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://cms_frontend;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://cms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================
    # Backend API - api.nhaphangchinhngach.vn
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name api.nhaphangchinhngach.vn;

        ssl_certificate /etc/letsencrypt/live/nhaphangchinhngach.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nhaphangchinhngach.vn/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # CORS headers
        add_header Access-Control-Allow-Origin "https://erp.nhaphangchinhngach.vn" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        limit_req zone=api burst=30 nodelay;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://erp.nhaphangchinhngach.vn" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for long-running API calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
