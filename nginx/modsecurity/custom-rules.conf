# ============================================
# TBS ERP - Custom WAF Rules
# ============================================
#
# These rules supplement the OWASP CRS with application-specific protections.
# Rule IDs: 10001-19999 (reserved for custom rules)

# ─── SQL Injection Protection ───────────────────────────────────────────────
# Block SQL injection patterns in all request parameters
SecRule ARGS "@detectSQLi" \
  "id:10001,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   msg:'SQL Injection Detected',\
   tag:'application-multi',\
   tag:'language-multi',\
   tag:'attack-sqli',\
   severity:'CRITICAL',\
   logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"

# ─── XSS Protection ────────────────────────────────────────────────────────
# Block XSS patterns in all request parameters
SecRule ARGS "@detectXSS" \
  "id:10002,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   msg:'XSS Attack Detected',\
   tag:'application-multi',\
   tag:'language-multi',\
   tag:'attack-xss',\
   severity:'CRITICAL',\
   logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"

# ─── Login Rate Limiting ───────────────────────────────────────────────────
# Track login attempts per IP address
SecAction \
  "id:10010,\
   phase:1,\
   pass,\
   nolog,\
   initcol:ip=%{REMOTE_ADDR}"

# Increment counter on login endpoint
SecRule REQUEST_URI "@streq /api/v1/auth/login" \
  "id:10011,\
   phase:2,\
   pass,\
   nolog,\
   chain"
SecRule REQUEST_METHOD "@streq POST" \
  "setvar:ip.login_count=+1,\
   expirevar:ip.login_count=600"

# Block if more than 10 login attempts in 10 minutes
SecRule IP:LOGIN_COUNT "@gt 10" \
  "id:10012,\
   phase:2,\
   deny,\
   status:429,\
   log,\
   msg:'Login Rate Limit Exceeded - %{IP.LOGIN_COUNT} attempts from %{REMOTE_ADDR}',\
   tag:'rate-limiting',\
   severity:'WARNING',\
   chain"
SecRule REQUEST_URI "@streq /api/v1/auth/login"

# ─── 2FA Brute Force Protection ────────────────────────────────────────────
SecRule REQUEST_URI "@streq /api/v1/auth/2fa/verify" \
  "id:10013,\
   phase:2,\
   pass,\
   nolog,\
   chain"
SecRule REQUEST_METHOD "@streq POST" \
  "setvar:ip.twofa_count=+1,\
   expirevar:ip.twofa_count=300"

SecRule IP:TWOFA_COUNT "@gt 5" \
  "id:10014,\
   phase:2,\
   deny,\
   status:429,\
   log,\
   msg:'2FA Verification Rate Limit Exceeded',\
   tag:'rate-limiting',\
   severity:'WARNING',\
   chain"
SecRule REQUEST_URI "@streq /api/v1/auth/2fa/verify"

# ─── Suspicious User-Agent Blocking ────────────────────────────────────────
# Block known vulnerability scanners and malicious bots
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(nikto|sqlmap|nmap|masscan|zgrab|gobuster|dirbuster|wpscan|acunetix|nessus|openvas|nuclei|httpx|subfinder|amass)" \
  "id:10020,\
   phase:1,\
   deny,\
   status:403,\
   log,\
   msg:'Malicious Scanner Detected: %{MATCHED_VAR}',\
   tag:'automation/security-scanner',\
   severity:'CRITICAL'"

# Block empty User-Agent (likely automated)
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
  "id:10021,\
   phase:1,\
   deny,\
   status:403,\
   log,\
   msg:'Empty User-Agent Header',\
   tag:'policy-violation',\
   severity:'WARNING'"

# ─── Admin Endpoint Protection ─────────────────────────────────────────────
# Extra logging for admin/dashboard access
SecRule REQUEST_URI "@beginsWith /api/v1/admin" \
  "id:10030,\
   phase:1,\
   pass,\
   log,\
   msg:'Admin endpoint accessed from %{REMOTE_ADDR}',\
   tag:'admin-access',\
   severity:'NOTICE'"

# ─── File Upload Protection ────────────────────────────────────────────────
# Block dangerous file extensions in uploads
SecRule FILES_NAMES "@rx \.(?:php|phtml|php3|php4|php5|pht|phar|exe|bat|cmd|com|vbs|vbe|js|wsh|wsf|cpl|scr)$" \
  "id:10040,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   msg:'Dangerous File Upload Blocked: %{MATCHED_VAR}',\
   tag:'attack-file-upload',\
   severity:'CRITICAL'"

# ─── Path Traversal Protection ─────────────────────────────────────────────
SecRule REQUEST_URI "@rx (?:\.\./|\.\.\\\\)" \
  "id:10050,\
   phase:1,\
   deny,\
   status:403,\
   log,\
   msg:'Path Traversal Attempt: %{MATCHED_VAR}',\
   tag:'attack-lfi',\
   severity:'CRITICAL'"

# ─── HTTP Method Restriction ───────────────────────────────────────────────
# Only allow standard HTTP methods
SecRule REQUEST_METHOD "!@rx ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$" \
  "id:10060,\
   phase:1,\
   deny,\
   status:405,\
   log,\
   msg:'Non-standard HTTP Method: %{REQUEST_METHOD}',\
   tag:'policy-violation',\
   severity:'WARNING'"

# ─── Request Size Limits ───────────────────────────────────────────────────
# Block excessively large URLs (potential buffer overflow attempt)
SecRule REQUEST_URI "@gt 2048" \
  "id:10070,\
   phase:1,\
   deny,\
   status:414,\
   log,\
   msg:'Request URI Too Long',\
   tag:'policy-violation',\
   severity:'WARNING'"

# ─── CRS Rule Exclusions for TBS ERP ───────────────────────────────────────
# Exclude false positives for our application

# Allow JSON content type for API requests (CRS sometimes flags these)
SecRuleRemoveById 920420

# Allow larger request bodies for file uploads
SecRuleUpdateTargetById 920370 "!REQUEST_HEADERS:Content-Type"

# Don't flag our API's legitimate CSRF token header
SecRuleRemoveById 942100
