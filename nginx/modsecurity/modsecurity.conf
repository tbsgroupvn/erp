# ============================================
# TBS ERP - ModSecurity WAF Configuration
# ============================================
#
# This configuration enables the ModSecurity Web Application Firewall
# with OWASP Core Rule Set (CRS) for the TBS ERP system.
#
# Mode: DetectionOnly → On (switch to "On" after testing)
# Start with DetectionOnly to avoid blocking legitimate traffic,
# then switch to "On" once rules are tuned.

# Enable ModSecurity
SecRuleEngine On

# Request body processing
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response body processing (disabled for performance)
SecResponseBodyAccess Off

# Temporary files directory
SecTmpDir /tmp/modsecurity/tmp
SecDataDir /tmp/modsecurity/data

# Audit log settings
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/audit.log

# Debug log (disable in production for performance)
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 0

# Default actions
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Server signature masking
SecServerSignature "Server"

# Unicode mapping
SecUnicodeMapFile /etc/modsecurity/unicode.mapping 20127

# ─── OWASP CRS Configuration ───
# The CRS rules are included from the OWASP ModSecurity CRS Docker image
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf.example
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# ─── Custom rules ───
Include /etc/modsecurity/custom/custom-rules.conf
