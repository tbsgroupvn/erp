version: '3.8'

# Local development: PostgreSQL & Redis only (backend runs via npm run start:dev)
services:
  postgres:
    image: postgres:16-alpine
    container_name: tbs_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbs_password}
      POSTGRES_DB: ${POSTGRES_DB:-tbs_erp}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tbs_user} -d ${POSTGRES_DB:-tbs_erp}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tbs_erp_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
