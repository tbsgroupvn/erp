; =========================================================
; PgBouncer Configuration — DEVELOPMENT ONLY
; =========================================================
; auth_type = any  →  no password checking in dev (no userlist.txt needed)
; Smaller pool/client limits appropriate for local dev workloads.
; DO NOT use this file in staging or production.

[databases]
; Map the logical DB name clients request → real PostgreSQL DB.
; With auth_type = any the client-supplied credentials are forwarded as-is
; to PostgreSQL, so no user= override is needed here.
tbs_erp = host=postgres port=5432 dbname=tbs_erp

[pgbouncer]
; ─── Pool Mode ───
; transaction: release connection after each transaction
; REQUIRED because Finance uses Serializable isolation
; and Wallet uses SELECT FOR UPDATE
pool_mode = transaction

; ─── Pool Sizing ───
; Smaller values are fine for a single-developer local environment.
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 2
reserve_pool_timeout = 3

; ─── Client Connections ───
max_client_conn = 50

; ─── Timeouts ───
; Query timeout: longest expected query is AR aging batch (~30s)
query_timeout = 60
; Idle transaction: prevent connection hogging
idle_transaction_timeout = 30
; Server idle: close unused backend connections after 5 min
server_idle_timeout = 300
; Client idle: close idle frontend connections after 10 min
client_idle_timeout = 600
; Connect timeout to PostgreSQL
server_connect_timeout = 5
; Login timeout for clients
client_login_timeout = 15

; ─── Logging ───
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; ─── Security ───
; "any" skips authentication — safe only in an isolated Docker dev network.
auth_type = any

; ─── Admin ───
listen_addr = 0.0.0.0
listen_port = 6432
admin_users = tbs_user
stats_users = tbs_user

; ─── TCP Keepalive ───
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6
