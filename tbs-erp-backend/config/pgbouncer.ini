; =========================================================
; PgBouncer Configuration for TBS ORDER ERP
; =========================================================
; Deploy alongside PostgreSQL container
; Docs: https://www.pgbouncer.org/config.html

[databases]
; Single database, all modules share the pool
tbs_erp = host=postgres port=5432 dbname=tbs_erp

[pgbouncer]
; ─── Pool Mode ───
; transaction: release connection after each transaction
; REQUIRED because Finance uses Serializable isolation
; and Wallet uses SELECT FOR UPDATE
pool_mode = transaction

; ─── Pool Sizing ───
; Formula: default_pool_size = num_cpu_cores * 2 + effective_spindle_count
; For 4-core server with SSD: 4*2 + 1 = 9, rounded up to 20 for safety
; Total backend connections: default_pool_size = 20
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; ─── Client Connections ───
; max_client_conn should be >> default_pool_size
; NestJS backend: ~10 module services × concurrent requests
; Frontend: SSR + API routes
max_client_conn = 200

; ─── Timeouts ───
; Query timeout: longest expected query is AR aging batch (~30s)
query_timeout = 60
; Idle transaction: prevent connection hogging
idle_transaction_timeout = 30
; Server idle: close unused backend connections after 5 min
server_idle_timeout = 300
; Client idle: close idle frontend connections after 10 min
client_idle_timeout = 600
; Connect timeout to PostgreSQL
server_connect_timeout = 5
; Login timeout for clients
client_login_timeout = 15

; ─── Logging ───
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; ─── Security ───
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ─── Admin ───
listen_addr = 0.0.0.0
listen_port = 6432
admin_users = postgres
stats_users = monitoring

; ─── TCP Keepalive ───
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6
