; ============================================
; TBS ERP - PgBouncer Connection Pooling
; ============================================

[databases]
; Primary database — all read/write operations
tbs_erp = host=postgres port=5432 dbname=tbs_erp

; Read replica — for future read-replica routing
; tbs_erp_readonly = host=postgres-replica port=5432 dbname=tbs_erp

[pgbouncer]
; Connection settings
; Docker network isolation provides security; binding to * allows container-to-container connections
listen_addr = *
listen_port = 6432

; Authentication — uses auth_query to fetch credentials from PostgreSQL directly
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
auth_user = pgbouncer_auth

; Pool mode
; transaction = server connection is returned to pool after each transaction
; This is optimal for applications with many short-lived connections
pool_mode = transaction

; Pool sizing
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 200

; Timeouts
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 1
query_timeout = 120
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Security
; Disable admin database access from non-local connections
admin_users = postgres
stats_users = postgres

; TLS configuration
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/server.key
client_tls_cert_file = /etc/pgbouncer/server.crt
