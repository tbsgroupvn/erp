# ============================================
# TBS ERP - Logstash Main Pipeline
# ============================================
# This is the primary pipeline configuration.
# Accepts structured JSON logs from NestJS via TCP
# and forwards them to Elasticsearch.

input {
  # NestJS application logs via TCP (JSON format)
  tcp {
    port => 5000
    codec => json_lines
    tags => ["backend"]
  }

  # Filebeat input for Nginx logs
  beats {
    port => 5044
    tags => ["filebeat"]
  }
}

filter {
  # ─── Backend (NestJS) Logs ───
  if "backend" in [tags] {
    # Ensure @timestamp is parsed correctly
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Add computed fields
    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "tbs-erp-logs"
        "log_source" => "backend"
      }
    }

    # Parse log level for severity-based filtering
    if [level] {
      mutate {
        lowercase => ["level"]
      }
    }

    # Extract HTTP info from message if present
    if [message] =~ /^(GET|POST|PUT|PATCH|DELETE)\s/ {
      grok {
        match => {
          "message" => "%{WORD:http_method} %{URIPATHPARAM:http_path} %{NUMBER:http_status:int} - %{NUMBER:response_time_ms:int}ms"
        }
        tag_on_failure => ["_grokparsefailure_http"]
      }
    }
  }

  # ─── Nginx Access Logs ───
  if "nginx-access" in [tags] {
    grok {
      match => {
        "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:http_method} %{URIPATHPARAM:request_uri} HTTP/%{NUMBER:http_version}" %{NUMBER:http_status:int} %{NUMBER:body_bytes_sent:int} "%{DATA:http_referer}" "%{DATA:http_user_agent}" "%{DATA:http_x_forwarded_for}"'
      }
      tag_on_failure => ["_grokparsefailure_nginx_access"]
    }

    date {
      match => ["time_local", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "tbs-erp-nginx"
        "log_source" => "nginx"
      }
      remove_field => ["time_local"]
    }

    # GeoIP lookup on client IP
    if [remote_addr] and [remote_addr] != "127.0.0.1" {
      geoip {
        source => "remote_addr"
        target => "geoip"
      }
    }

    # Parse user agent
    useragent {
      source => "http_user_agent"
      target => "user_agent"
    }
  }

  # ─── Nginx Error Logs ───
  if "nginx-error" in [tags] {
    grok {
      match => {
        "message" => "%{DATA:time} \[%{DATA:log_level}\] %{NUMBER:pid}#%{NUMBER:tid}: %{GREEDYDATA:error_message}"
      }
      tag_on_failure => ["_grokparsefailure_nginx_error"]
    }

    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "tbs-erp-nginx"
        "log_source" => "nginx-error"
      }
    }
  }

  # ─── Common: Remove unnecessary fields ───
  mutate {
    remove_field => ["host", "port", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    manage_template => true
    template_name => "tbs-erp-logs"
    template_overwrite => true
  }
}
