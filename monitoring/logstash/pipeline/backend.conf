# ============================================
# TBS ERP - Logstash Pipeline: NestJS Backend
# ============================================
# Processes structured JSON logs from the NestJS application.

input {
  tcp {
    port => 5000
    codec => json_lines
    tags => ["backend"]
    type => "backend"
  }
}

filter {
  if [type] == "backend" {
    # Ensure timestamp is in ISO8601
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Normalize log level
    if [level] {
      mutate {
        lowercase => ["level"]
      }
    }

    # Tag error-level logs for alerting
    if [level] in ["error", "fatal"] {
      mutate {
        add_tag => ["error"]
      }
    }

    # Tag slow requests (>3s)
    if [meta][duration_ms] and [meta][duration_ms] > 3000 {
      mutate {
        add_tag => ["slow_request"]
      }
    }

    # Enrich with index metadata
    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "tbs-erp-logs"
        "log_source" => "nestjs"
      }
    }

    # Parse stack traces into structured fields
    if [stack] {
      mutate {
        gsub => ["stack", "\r\n", "\n"]
      }
    }
  }
}

output {
  if [type] == "backend" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "tbs-erp-logs-%{+YYYY.MM.dd}"
    }
  }
}
