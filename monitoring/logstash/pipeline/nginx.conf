# ============================================
# TBS ERP - Logstash Pipeline: Nginx Logs
# ============================================
# Parses Nginx access and error logs received from Filebeat.

input {
  beats {
    port => 5044
    type => "nginx"
  }
}

filter {
  if [type] == "nginx" {
    # ─── Access logs ───
    if [log][file][path] =~ "access" {
      grok {
        match => {
          "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:http_method} %{URIPATHPARAM:request_uri} HTTP/%{NUMBER:http_version}" %{NUMBER:http_status:int} %{NUMBER:body_bytes_sent:int} "%{DATA:http_referer}" "%{DATA:http_user_agent}" "%{DATA:http_x_forwarded_for}"'
        }
        tag_on_failure => ["_grokparsefailure_nginx_access"]
      }

      date {
        match => ["time_local", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
      }

      mutate {
        add_field => { "log_type" => "access" }
        remove_field => ["time_local"]
      }

      # Classify HTTP status codes
      if [http_status] >= 500 {
        mutate { add_tag => ["error", "5xx"] }
      } else if [http_status] >= 400 {
        mutate { add_tag => ["client_error", "4xx"] }
      }

      # GeoIP enrichment
      if [remote_addr] and [remote_addr] !~ /^(127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/ {
        geoip {
          source => "remote_addr"
          target => "geoip"
        }
      }

      # User agent parsing
      useragent {
        source => "http_user_agent"
        target => "user_agent"
      }
    }

    # ─── Error logs ───
    if [log][file][path] =~ "error" {
      grok {
        match => {
          "message" => "%{DATA:nginx_timestamp} \[%{DATA:log_level}\] %{NUMBER:pid:int}#%{NUMBER:tid:int}: (\*%{NUMBER:connection_id:int} )?%{GREEDYDATA:error_message}"
        }
        tag_on_failure => ["_grokparsefailure_nginx_error"]
      }

      mutate {
        add_field => { "log_type" => "error" }
        add_tag => ["error"]
      }
    }

    # Common enrichment
    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "tbs-erp-nginx"
        "log_source" => "nginx"
      }
    }
  }
}

output {
  if [type] == "nginx" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "tbs-erp-nginx-%{+YYYY.MM.dd}"
    }
  }
}
