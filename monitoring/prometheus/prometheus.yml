# ============================================
# TBS ERP - Prometheus Configuration
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: 'tbs-erp'
    environment: 'production'

rule_files:
  - "alerts.yml"

scrape_configs:
  # ─── TBS ERP Backend (NestJS) ───
  - job_name: 'tbs-erp-backend'
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'backend'
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # ─── Nginx Exporter ───
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'

  # ─── PostgreSQL Exporter ───
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # ─── Redis Exporter ───
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # ─── Prometheus Self-Monitoring ───
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
