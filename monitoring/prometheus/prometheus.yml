# ============================================
# TBS ERP - Prometheus Configuration
# Scrapes: backend, node-exporter, postgres-exporter, redis-exporter
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: 'tbs-erp'
    environment: 'development'

rule_files:
  - "alerts.yml"

scrape_configs:
  # ─── TBS ERP Backend (NestJS/prom-client) ───
  # Controller: @Controller('metrics') under global prefix 'api/v1'
  # Full path: GET /api/v1/metrics  (@Public, no auth required)
  - job_name: 'tbs-backend'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'backend'

  # ─── Node Exporter (host OS metrics) ───
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  # ─── PostgreSQL Exporter ───
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # ─── Redis Exporter ───
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # ─── Prometheus Self-Monitoring ───
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
