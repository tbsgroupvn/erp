# ============================================
# TBS ERP - Grafana Dashboard Provisioning
# ============================================

apiVersion: 1

providers:
  - name: 'TBS ERP Dashboards'
    orgId: 1
    folder: 'TBS ERP'
    folderUid: 'tbs-erp'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
