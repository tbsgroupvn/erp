# ============================================
# TBS ERP - Grafana Datasource Provisioning
# ============================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'
      httpMethod: POST

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: 'tbs-erp-logs-*'
    editable: false
    basicAuth: true
    basicAuthUser: elastic
    secureJsonData:
      basicAuthPassword: $__env{ELASTIC_PASSWORD}
    jsonData:
      esVersion: '8.12.0'
      timeField: '@timestamp'
      logMessageField: message
      logLevelField: level
      interval: Daily
