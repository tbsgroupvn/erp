# ============================================
# TBS ERP - Staging Environment
# Based on docker-compose.selfhost.yml with staging overrides.
# Usage: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
# Container prefix: tbs_staging_
# Ports: backend 3101:3000, frontend 3100:3000, PostgreSQL 5434:5432
# ============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: tbs_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db_staging}
    command: postgres -c password_encryption=scram-sha-256
    ports:
      - '5434:5432'
    volumes:
      - tbs_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_db_staging}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_staging_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: tbs_staging_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - tbs_staging_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_staging_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # CONNECTION POOLER — PgBouncer (staging)
  # ============================================
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: tbs_staging_pgbouncer
    restart: unless-stopped
    volumes:
      - ./tbs-erp-backend/config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./tbs-erp-backend/config/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-p', '6432', '-U', '${POSTGRES_USER:-erp_user}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tbs_staging_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-tbs-erp/tbs-erp}-backend:staging
    container_name: tbs_staging_backend
    restart: unless-stopped
    ports:
      - '3101:3000'
    environment:
      NODE_ENV: staging
      PORT: 3000
      # Routes runtime queries through PgBouncer (transaction pooling).
      # ?pgbouncer=true disables Prisma prepared statements, required for transaction mode.
      # NOTE: "tbs_erp" is the PgBouncer logical DB name defined in pgbouncer.ini [databases].
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD}@pgbouncer:6432/tbs_erp?pgbouncer=true
      # Direct connection bypasses PgBouncer — used by Prisma migrate.
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp_db_staging}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.tbslogistics.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://staging.tbslogistics.com}
      # Encryption
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required}
      FIELD_ENCRYPTION_KEY_VERSION: ${FIELD_ENCRYPTION_KEY_VERSION:-v1}
      TWO_FA_ENCRYPTION_KEY: ${TWO_FA_ENCRYPTION_KEY:?TWO_FA_ENCRYPTION_KEY is required}
      TWO_FA_ENCRYPTION_SALT: ${TWO_FA_ENCRYPTION_SALT:?TWO_FA_ENCRYPTION_SALT is required}
      # Sentry error tracking
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: '1.0'
      SENTRY_PROFILES_SAMPLE_RATE: '0.5'
      # App metadata
      APP_ENV: staging
      GIT_SHA: ${GIT_SHA:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # BullMQ
      BULLMQ_REDIS_HOST: redis
      BULLMQ_REDIS_PORT: 6379
      BULLMQ_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Database connection pool
      # Pool size = num_cores * 2 + disk_spindles. Default 20 for 50-70 concurrent users.
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      # Queue worker concurrency (jobs processed in parallel per queue)
      ORDER_QUEUE_CONCURRENCY: ${ORDER_QUEUE_CONCURRENCY:-3}
      NOTIFICATION_QUEUE_CONCURRENCY: ${NOTIFICATION_QUEUE_CONCURRENCY:-5}
      FINANCE_QUEUE_CONCURRENCY: ${FINANCE_QUEUE_CONCURRENCY:-2}
      WAREHOUSE_QUEUE_CONCURRENCY: ${WAREHOUSE_QUEUE_CONCURRENCY:-3}
      INTEGRATION_QUEUE_CONCURRENCY: ${INTEGRATION_QUEUE_CONCURRENCY:-2}
      # Queue rate limiting (max jobs per duration window across all queues)
      QUEUE_RATE_LIMIT_MAX: ${QUEUE_RATE_LIMIT_MAX:-100}
      QUEUE_RATE_LIMIT_DURATION_MS: ${QUEUE_RATE_LIMIT_DURATION_MS:-10000}
      # Queue stalled job recovery
      QUEUE_STALLED_INTERVAL_MS: ${QUEUE_STALLED_INTERVAL_MS:-30000}
      QUEUE_MAX_STALLED_COUNT: ${QUEUE_MAX_STALLED_COUNT:-2}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_staging_network
    volumes:
      - ./logs/backend:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-staging.rule=Host(`staging-api.tbslogistics.com`)"
      - "traefik.http.routers.backend-staging.tls=true"
      - "traefik.http.routers.backend-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-staging.loadbalancer.server.port=3000"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-tbs-erp/tbs-erp}-frontend:staging
    container_name: tbs_staging_frontend
    restart: unless-stopped
    ports:
      - '3100:3000'
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://staging-api.tbslogistics.com/api/v1}
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_staging_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-staging.rule=Host(`staging.tbslogistics.com`)"
      - "traefik.http.routers.frontend-staging.tls=true"
      - "traefik.http.routers.frontend-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-staging.loadbalancer.server.port=3000"

  # ============================================
  # MIGRATE - One-off migration & seed
  # Run manually: docker compose -f docker-compose.staging.yml run --rm migrate
  # ============================================
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-tbs-erp/tbs-erp}-backend:staging
    container_name: tbs_staging_migrate
    profiles: ['migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp_db_staging}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbs_staging_network
    working_dir: /app
    command: sh -c "npx prisma migrate deploy"

networks:
  tbs_staging_network:
    driver: bridge

volumes:
  tbs_staging_pgdata:
    name: tbs_staging_pgdata
  tbs_staging_redisdata:
    name: tbs_staging_redisdata
