# ============================================
# TBS ERP - Production Environment
# ============================================

version: '3.8'

services:
  # ============================================
  # DATABASE - PostgreSQL Primary
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tbs_erp_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - backups_prod:/backups
      - ./postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================
  # DATABASE - PostgreSQL Read Replica
  # ============================================
  postgres-replica:
    image: postgres:16-alpine
    container_name: tbs_erp_postgres_replica_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata_replica_prod:/var/lib/postgresql/data
      - ./postgres/replica/setup-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================
  # CONNECTION POOLER - PgBouncer
  # ============================================
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: tbs_erp_pgbouncer_prod
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: tbs_erp_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required for production}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
    # container_name removed: incompatible with replicas > 1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Use PgBouncer for connection pooling (transaction mode)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?pgbouncer=true
      # Direct connection for Prisma migrations (bypasses PgBouncer)
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: https://app.tbslogistics.com,https://nhaphangchinhngach.vn
      FRONTEND_URL: https://app.tbslogistics.com
      # REQUIRED: Sentry DSN for error tracking in production
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required for production deployment}
      SENTRY_TRACES_SAMPLE_RATE: '0.2'
      SENTRY_PROFILES_SAMPLE_RATE: '0.1'
      GIT_SHA: ${GIT_SHA:-}
      LOG_LEVEL: info
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
      # ELK Stack Integration
      ELK_ENABLED: 'true'
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      # BullMQ (uses same Redis instance)
      BULLMQ_REDIS_HOST: redis
      BULLMQ_REDIS_PORT: 6379
      BULLMQ_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # GraphQL
      GRAPHQL_PLAYGROUND: 'false'
      GRAPHQL_INTROSPECTION: 'false'
      # Field-Level Encryption
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for production}
      FIELD_ENCRYPTION_KEY_VERSION: ${FIELD_ENCRYPTION_KEY_VERSION:-v1}
      FIELD_ENCRYPTION_PREVIOUS_KEYS: ${FIELD_ENCRYPTION_PREVIOUS_KEYS:-}
      TWO_FA_ENCRYPTION_KEY: ${TWO_FA_ENCRYPTION_KEY:?TWO_FA_ENCRYPTION_KEY is required for production}
      # HashiCorp Vault (optional — falls back to env vars)
      VAULT_ENABLED: ${VAULT_ENABLED:-false}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_SECRET_PATH: ${VAULT_SECRET_PATH:-secret/data/tbs-erp}
      VAULT_RENEW_INTERVAL: '3600000'
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network
    volumes:
      - ./logs/backend:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
      replicas: 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-prod.rule=Host(`api.tbslogistics.com`)"
      - "traefik.http.routers.backend-prod.tls=true"
      - "traefik.http.routers.backend-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-prod.loadbalancer.server.port=3000"
      - "traefik.http.services.backend-prod.loadbalancer.healthcheck.path=/api/v1/health"
      - "traefik.http.services.backend-prod.loadbalancer.healthcheck.interval=10s"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}-frontend:latest
    # container_name removed: incompatible with replicas > 1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.tbslogistics.com/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      replicas: 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-prod.rule=Host(`app.tbslogistics.com`)"
      - "traefik.http.routers.frontend-prod.tls=true"
      - "traefik.http.routers.frontend-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-prod.loadbalancer.server.port=3000"

  # ============================================
  # BACKUP - Automated PostgreSQL Backups
  # ============================================
  backup:
    image: postgres:16-alpine
    container_name: tbs_erp_backup_prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Optional: S3 upload support
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - backups_prod:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/restore.sh:/scripts/restore.sh:ro
      - ./scripts/verify-backup.sh:/scripts/verify-backup.sh:ro
      - ./scripts/backup-cron:/etc/crontabs/root:ro
      - backup_logs_prod:/var/log
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbs_network
    entrypoint: /bin/sh
    command: ["-c", "chmod +x /scripts/*.sh && crond -f -l 2"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # MONITORING - Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: tbs_erp_prometheus_prod
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # MONITORING - Grafana
  # ============================================
  grafana:
    image: grafana/grafana:10.3.0
    container_name: tbs_erp_grafana_prod
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data_prod:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://grafana.tbslogistics.com
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # MONITORING - PostgreSQL Exporter
  # ============================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tbs_erp_pg_exporter_prod
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9187/metrics']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # MONITORING - Redis Exporter
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.56.0
    container_name: tbs_erp_redis_exporter_prod
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9121/metrics']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # MONITORING - Nginx Exporter
  # ============================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: tbs_erp_nginx_exporter_prod
    restart: unless-stopped
    command: ['--nginx.scrape-uri=http://nginx:8080/stub_status']
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9113/metrics']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # SECRETS MANAGEMENT - HashiCorp Vault
  # ============================================
  vault:
    image: hashicorp/vault:1.15
    container_name: tbs_erp_vault_prod
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://vault:8200
    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/init-vault.sh:/vault/scripts/init-vault.sh:ro
      - vault_data_prod:/vault/data
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      test: ['CMD', 'vault', 'status', '-address=http://127.0.0.1:8200']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # WAF - Nginx with ModSecurity (OWASP CRS)
  # ============================================
  nginx:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: tbs_erp_nginx_waf_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/modsecurity/modsecurity.conf:/etc/modsecurity.d/modsecurity-override.conf:ro
      - ./nginx/modsecurity/custom-rules.conf:/etc/modsecurity/custom/custom-rules.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - waf_logs_prod:/var/log/modsecurity
      - nginx_logs_prod:/var/log/nginx
      - nginx_cache_static_prod:/var/cache/nginx/static
      - nginx_cache_api_prod:/var/cache/nginx/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/stub_status']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # ELK STACK - Elasticsearch
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: tbs_erp_elasticsearch_prod
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required for production}
      - cluster.name=tbs-erp-logs
    volumes:
      - ./monitoring/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch_data_prod:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================
  # ELK STACK - Logstash
  # ============================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: tbs_erp_logstash_prod
    restart: unless-stopped
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9600/_node/stats || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # ELK STACK - Kibana
  # ============================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: tbs_erp_kibana_prod
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./monitoring/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:5601/api/status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - tbs_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  tbs_network:
    driver: bridge

volumes:
  pgdata_prod:
    name: tbs_erp_pgdata_prod
  pgdata_replica_prod:
    name: tbs_erp_pgdata_replica_prod
  redisdata_prod:
    name: tbs_erp_redisdata_prod
  backups_prod:
    name: tbs_erp_backups_prod
  backup_logs_prod:
    name: tbs_erp_backup_logs_prod
  prometheus_data_prod:
    name: tbs_erp_prometheus_data_prod
  grafana_data_prod:
    name: tbs_erp_grafana_data_prod
  elasticsearch_data_prod:
    name: tbs_erp_elasticsearch_data_prod
  vault_data_prod:
    name: tbs_erp_vault_data_prod
  waf_logs_prod:
    name: tbs_erp_waf_logs_prod
  nginx_logs_prod:
    name: tbs_erp_nginx_logs_prod
  nginx_cache_static_prod:
    name: tbs_erp_nginx_cache_static_prod
  nginx_cache_api_prod:
    name: tbs_erp_nginx_cache_api_prod
