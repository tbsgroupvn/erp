# ============================================
# TBS ERP Backend - Analysis Templates for Argo Rollouts
# ============================================
# These templates define automated checks that run before
# promoting a new version in the blue/green deployment.
#
# Metrics are sourced from Prometheus. The analysis runs
# during the prePromotionAnalysis phase of the Rollout.
# ============================================

# ============================================
# Success Rate Analysis
# ============================================
# Checks that the preview (new) version maintains >95% success rate
# over a 5-minute window before promotion is allowed.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tbs-backend-success-rate
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: analysis
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      # Check every 30 seconds
      interval: 30s
      # Must pass 5 consecutive checks
      count: 5
      # Success if >95% of requests return non-5xx
      successCondition: result[0] >= 0.95
      # Fail immediately if <80%
      failureCondition: result[0] < 0.80
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.tbs-erp.svc.cluster.local:9090
          query: |
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}",
                status_code!~"5.."
              }[5m]
            )) /
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}"
              }[5m]
            ))
---
# ============================================
# Latency Analysis
# ============================================
# Checks that P99 latency of the preview version stays under 2 seconds.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tbs-backend-latency
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: analysis
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  args:
    - name: service-name
  metrics:
    - name: p99-latency
      interval: 30s
      count: 5
      # P99 latency must be under 2 seconds
      successCondition: result[0] < 2.0
      failureCondition: result[0] > 5.0
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.tbs-erp.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(
                http_request_duration_seconds_bucket{
                  service="{{args.service-name}}"
                }[5m]
              )) by (le)
            )
---
# ============================================
# Error Rate Analysis
# ============================================
# Checks that the 5xx error count stays below an absolute threshold.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tbs-backend-error-count
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: analysis
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  args:
    - name: service-name
  metrics:
    - name: error-count
      interval: 60s
      count: 3
      # Fewer than 10 errors per minute
      successCondition: result[0] < 10
      failureCondition: result[0] >= 50
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.tbs-erp.svc.cluster.local:9090
          query: |
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}",
                status_code=~"5.."
              }[1m]
            )) * 60
---
# ============================================
# Pod Restart Analysis
# ============================================
# Checks that the new pods are not crash-looping.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tbs-backend-pod-restarts
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: analysis
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  args:
    - name: service-name
  metrics:
    - name: pod-restarts
      interval: 60s
      count: 3
      # No restarts during analysis period
      successCondition: result[0] == 0
      failureCondition: result[0] > 2
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.tbs-erp.svc.cluster.local:9090
          query: |
            sum(increase(
              kube_pod_container_status_restarts_total{
                namespace="tbs-erp",
                container="backend"
              }[5m]
            ))
