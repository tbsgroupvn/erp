apiVersion: v1
kind: Service
metadata:
  name: tbs-backend
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tbs-backend-config
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tbs-erp-system
data:
  CORS_ORIGINS: "https://erp.nhaphangchinhngach.vn,https://nhaphangchinhngach.vn"
  FRONTEND_URL: "https://erp.nhaphangchinhngach.vn"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  SENTRY_TRACES_SAMPLE_RATE: "0.2"
  SENTRY_PROFILES_SAMPLE_RATE: "0.1"
  LOG_LEVEL: "info"
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_MAX: "100"
