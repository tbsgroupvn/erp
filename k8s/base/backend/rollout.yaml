# ============================================
# TBS ERP Backend - Argo Rollout (Blue/Green)
# ============================================
# Replaces the standard Deployment with an Argo Rollout
# for blue/green deployment strategy with automated analysis.
#
# Prerequisites:
#   - Argo Rollouts controller installed in the cluster
#   - Prometheus available for analysis metrics
#
# The Rollout maintains two ReplicaSets (blue/green). Traffic is
# switched atomically via the activeService/previewService pair.
# autoPromotionEnabled=false requires manual or analysis-based promotion.
# ============================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: tbs-backend
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tbs-erp-system
    app.kubernetes.io/managed-by: argo-rollouts
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: tbs-backend
      app.kubernetes.io/component: api
  strategy:
    blueGreen:
      # Service that receives production traffic
      activeService: tbs-backend-active
      # Service that receives preview/canary traffic for testing
      previewService: tbs-backend-preview
      # Do NOT auto-promote; require analysis or manual approval
      autoPromotionEnabled: false
      # Run analysis before promoting the new version
      prePromotionAnalysis:
        templates:
          - templateName: tbs-backend-success-rate
        args:
          - name: service-name
            value: tbs-backend-preview
      # Keep old ReplicaSet scaled down (not terminated) for 10 min
      scaleDownDelaySeconds: 600
      # Revision to scale down after switch
      scaleDownDelayRevisionLimit: 2
      # Anti-affinity strategy for blue/green pods
      antiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          weight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tbs-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: tbs-erp-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      serviceAccountName: tbs-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/tbs-logistics/tbs-erp-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tbs-backend-config
            - secretRef:
                name: tbs-erp-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: REDIS_HOST
              value: "tbs-redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-pull-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - tbs-backend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tbs-backend
---
# Active service - receives production traffic
apiVersion: v1
kind: Service
metadata:
  name: tbs-backend-active
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
# Preview service - receives test traffic before promotion
apiVersion: v1
kind: Service
metadata:
  name: tbs-backend-preview
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api-preview
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
