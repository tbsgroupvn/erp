apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tbs-erp

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: tbs-erp-system

resources:
  # Namespace
  - namespace.yaml

  # Secrets and ServiceAccounts
  - secrets/sealed-secret.yaml

  # Backend (Argo Rollout replaces standard Deployment)
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/hpa.yaml
  - backend/rollout.yaml
  - backend/analysis-template.yaml

  # ERP Frontend
  - erp-frontend/deployment.yaml
  - erp-frontend/service.yaml
  - erp-frontend/hpa.yaml

  # CMS Frontend
  - cms-frontend/deployment.yaml
  - cms-frontend/service.yaml
  - cms-frontend/hpa.yaml

  # PostgreSQL
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - postgres/configmap.yaml

  # Redis
  - redis/deployment.yaml
  - redis/service.yaml
  - redis/configmap.yaml

  # Ingress
  - ingress/ingress.yaml
