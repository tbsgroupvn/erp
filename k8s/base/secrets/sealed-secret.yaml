# =============================================================
# TBS ERP Secrets Template
# =============================================================
# WARNING: This file contains PLACEHOLDER values only.
# Do NOT commit actual secrets to version control.
#
# For production, use one of the following approaches:
#   1. Sealed Secrets: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#   2. External Secrets Operator: sync from AWS Secrets Manager / Vault
#   3. SOPS: encrypt with mozilla/sops before committing
#
# To create the secret manually:
#   kubectl create secret generic tbs-erp-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=JWT_REFRESH_SECRET='...' \
#     --from-literal=SENTRY_DSN='...' \
#     -n tbs-erp
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: tbs-erp-secrets
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-erp-secrets
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: tbs-erp-system
type: Opaque
stringData:
  # Inject via kubeseal or External Secrets Operator before applying to cluster.
  # Example format: postgresql://USER:PASSWORD@tbs-postgres:5432/tbs_erp
  DATABASE_URL: "REPLACE-BEFORE-DEPLOY" # nosec: placeholder — no real credentials here

  # Inject via kubeseal or External Secrets Operator before applying to cluster.
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "REPLACE-BEFORE-DEPLOY" # nosec: placeholder — no real credentials here

  # Inject via kubeseal or External Secrets Operator before applying to cluster.
  # Generate with: openssl rand -hex 32
  JWT_REFRESH_SECRET: "REPLACE-BEFORE-DEPLOY" # nosec: placeholder — no real credentials here

  # Inject via kubeseal or External Secrets Operator before applying to cluster.
  # Example format: https://<key>@<org>.ingest.sentry.io/<project-id>
  SENTRY_DSN: "REPLACE-BEFORE-DEPLOY" # nosec: placeholder — no real credentials here
---
apiVersion: v1
kind: Secret
metadata:
  name: tbs-postgres-secrets
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tbs-erp-system
type: Opaque
stringData:
  # Inject via kubeseal or External Secrets Operator before applying to cluster.
  POSTGRES_USER: "REPLACE-BEFORE-DEPLOY" # nosec: placeholder — no real credentials here
  # Inject via kubeseal or External Secrets Operator before applying to cluster.
  # Generate with: openssl rand -base64 24
  POSTGRES_PASSWORD: "REPLACE-BEFORE-DEPLOY" # nosec: placeholder — no real credentials here
---
# ServiceAccount for backend workloads
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tbs-backend-sa
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tbs-erp-system
---
# ServiceAccount for frontend workloads
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tbs-frontend-sa
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tbs-erp-system
