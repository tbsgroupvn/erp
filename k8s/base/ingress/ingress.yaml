apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tbs-erp-ingress
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-erp-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: tbs-erp-system
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: nginx
    # TLS via cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=()";
    # SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # HSTS
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Gzip
    nginx.ingress.kubernetes.io/enable-gzip: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - erp.nhaphangchinhngach.vn
        - nhaphangchinhngach.vn
        - www.nhaphangchinhngach.vn
        - api.nhaphangchinhngach.vn
      secretName: tbs-erp-tls
  rules:
    # ERP Frontend
    - host: erp.nhaphangchinhngach.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tbs-erp-frontend
                port:
                  number: 3000
    # CMS Frontend
    - host: nhaphangchinhngach.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tbs-cms-frontend
                port:
                  number: 3000
    - host: www.nhaphangchinhngach.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tbs-cms-frontend
                port:
                  number: 3000
    # Backend API
    - host: api.nhaphangchinhngach.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tbs-backend
                port:
                  number: 3000
