apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tbs-cms-frontend-hpa
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-cms-frontend
    app.kubernetes.io/component: cms
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tbs-cms-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
