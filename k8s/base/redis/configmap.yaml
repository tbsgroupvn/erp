apiVersion: v1
kind: ConfigMap
metadata:
  name: tbs-redis-config
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tbs-erp-system
data:
  redis.conf: |
    # Memory
    maxmemory 512mb
    maxmemory-policy allkeys-lru

    # Persistence
    appendonly yes
    appendfsync everysec
    save 60 1000

    # Security
    protected-mode yes

    # Performance
    tcp-backlog 511
    tcp-keepalive 300
    timeout 0

    # Logging
    loglevel warning
