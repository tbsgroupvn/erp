apiVersion: v1
kind: Service
metadata:
  name: tbs-redis
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tbs-redis
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tbs-redis-data
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tbs-erp-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
