apiVersion: v1
kind: ConfigMap
metadata:
  name: tbs-postgres-config
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tbs-erp-system
data:
  POSTGRES_DB: "tbs_erp"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  # PostgreSQL tuning parameters
  POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: tbs-erp
  labels:
    app.kubernetes.io/name: tbs-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tbs-erp-system
data:
  postgresql.conf: |
    # Connection settings
    max_connections = 200
    superuser_reserved_connections = 3

    # Memory settings
    shared_buffers = 512MB
    effective_cache_size = 1536MB
    work_mem = 4MB
    maintenance_work_mem = 128MB

    # WAL settings
    wal_level = replica
    max_wal_size = 1GB
    min_wal_size = 256MB
    checkpoint_completion_target = 0.9

    # Query planner
    random_page_cost = 1.1
    effective_io_concurrency = 200

    # Logging
    log_min_duration_statement = 1000
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_temp_files = 0

    # Autovacuum
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 60
