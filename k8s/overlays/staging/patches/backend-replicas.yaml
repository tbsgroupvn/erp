# Staging: 1 replica for all services
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbs-backend
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbs-erp-frontend
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbs-cms-frontend
spec:
  replicas: 1
---
# HPA at staging scale
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tbs-backend-hpa
spec:
  minReplicas: 1
  maxReplicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tbs-erp-frontend-hpa
spec:
  minReplicas: 1
  maxReplicas: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tbs-cms-frontend-hpa
spec:
  minReplicas: 1
  maxReplicas: 2
