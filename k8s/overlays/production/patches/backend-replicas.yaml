# Production: 2+ replicas with HPA handling scale-up
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbs-backend
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbs-erp-frontend
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbs-cms-frontend
spec:
  replicas: 2
---
# Production HPA settings
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tbs-backend-hpa
spec:
  minReplicas: 2
  maxReplicas: 8
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tbs-erp-frontend-hpa
spec:
  minReplicas: 2
  maxReplicas: 6
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tbs-cms-frontend-hpa
spec:
  minReplicas: 2
  maxReplicas: 6
