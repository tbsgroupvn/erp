apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tbs-erp-dev

namePrefix: dev-

commonLabels:
  environment: dev

resources:
  - ../../base

# Remove HPA in dev (not needed)
# Override resources are handled via patches

patches:
  - path: patches/backend-replicas.yaml
  - path: patches/resource-limits.yaml

# Override the namespace
# Dev uses a separate namespace to avoid conflicts
