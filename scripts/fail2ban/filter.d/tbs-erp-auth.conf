# ============================================
# TBS ERP - Fail2Ban Filter for Auth Failures
# ============================================
#
# Detects failed authentication attempts from nginx access logs.
# Matches:
#   - Failed login attempts (401 on /api/v1/auth/login)
#   - Failed 2FA verification (401 on /api/v1/auth/2fa/verify)
#   - Failed password reset (400/401 on /api/v1/auth/reset-password)
#   - Rate limited requests (429)

[Definition]

# Matches failed login and 2FA attempts
failregex = ^<HOST>.*"POST /api/v1/auth/login HTTP[^"]*" 401
            ^<HOST>.*"POST /api/v1/auth/2fa/verify HTTP[^"]*" 401
            ^<HOST>.*"POST /api/v1/auth/reset-password HTTP[^"]*" (400|401)
            ^<HOST>.*"POST /api/v1/auth/forgot-password HTTP[^"]*" 429
            ^<HOST>.*"(GET|POST|PUT|DELETE|PATCH) /api/v1/[^ ]* HTTP[^"]*" 429

# Ignore successful requests and health checks
ignoreregex = ^<HOST>.*"GET /api/v1/health HTTP[^"]*" 200
              ^<HOST>.*"GET /api/v1/metrics HTTP[^"]*"

[Init]
# Date format in nginx log: [dd/Mon/yyyy:HH:MM:SS +0000]
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
