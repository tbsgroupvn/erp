# ============================================
# TBS ERP - Complete Docker Compose
# Services: PostgreSQL, Redis, Backend, Frontend, CMS, Nginx
# ============================================

services:
  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tbs_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbs_password}
      POSTGRES_DB: ${POSTGRES_DB:-tbs_erp}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tbs_user} -d ${POSTGRES_DB:-tbs_erp}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_network

  # ============================================
  # CACHE - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tbs_erp_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_network

  # ============================================
  # BACKEND - NestJS API
  # ============================================
  backend:
    build:
      context: ./tbs-erp-backend
      dockerfile: Dockerfile
      target: production
    container_name: tbs_erp_backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3001}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tbs_user}:${POSTGRES_PASSWORD:-tbs_password}@postgres:5432/${POSTGRES_DB:-tbs_erp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network
    volumes:
      - backend_logs:/app/logs

  # ============================================
  # FRONTEND - ERP Next.js
  # ============================================
  frontend:
    build:
      context: ./tbs-erp-frontend
      dockerfile: Dockerfile
      target: production
    container_name: tbs_erp_frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network

  # ============================================
  # CMS FRONTEND - Next.js
  # ============================================
  cms:
    build:
      context: ./tbs-cms-frontend
      dockerfile: Dockerfile
      target: production
    container_name: tbs_cms_frontend
    restart: unless-stopped
    ports:
      - '${CMS_PORT:-3002}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_CMS_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TBS ERP}
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network

  # ============================================
  # NGINX - Reverse Proxy + SSL
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: tbs_erp_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - cms
      - backend
    networks:
      - tbs_network
    # Reload nginx config every 6 hours (for cert renewal)
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # ============================================
  # CERTBOT - SSL Certificate Management
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: tbs_erp_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renew certificates every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# ============================================
# NETWORKS
# ============================================
networks:
  tbs_network:
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  pgdata:
    name: tbs_erp_pgdata
  redisdata:
    name: tbs_erp_redisdata
  backend_logs:
    name: tbs_erp_backend_logs
  certbot_conf:
    name: tbs_erp_certbot_conf
  certbot_www:
    name: tbs_erp_certbot_www
  nginx_logs:
    name: tbs_erp_nginx_logs
