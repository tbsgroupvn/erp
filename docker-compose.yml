# ============================================
# TBS ERP - Complete Docker Compose
# Services: PostgreSQL, Redis, Backend, Frontend, CMS, Nginx
# ============================================

services:
  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tbs_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbs_password}
      POSTGRES_DB: ${POSTGRES_DB:-tbs_erp}
    command: postgres -c password_encryption=scram-sha-256
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tbs_user} -d ${POSTGRES_DB:-tbs_erp}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_network

  # ============================================
  # CACHE - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tbs_erp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev_redis_pass}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-dev_redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbs_network

  # ============================================
  # BACKEND - NestJS API
  # ============================================
  backend:
    build:
      context: ./tbs-erp-backend
      dockerfile: Dockerfile
      target: production
    container_name: tbs_erp_backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3001}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tbs_user}:${POSTGRES_PASSWORD:-tbs_password}@postgres:5432/${POSTGRES_DB:-tbs_erp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      # ELK Stack Integration (disabled by default in dev)
      ELK_ENABLED: ${ELK_ENABLED:-false}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      # BullMQ (uses same Redis instance)
      BULLMQ_REDIS_HOST: redis
      BULLMQ_REDIS_PORT: 6379
      # GraphQL (enabled in dev)
      GRAPHQL_PLAYGROUND: 'true'
      GRAPHQL_INTROSPECTION: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network
    volumes:
      - backend_logs:/app/logs

  # ============================================
  # FRONTEND - ERP Next.js
  # ============================================
  frontend:
    build:
      context: ./tbs-erp-frontend
      dockerfile: Dockerfile
      target: production
    container_name: tbs_erp_frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network

  # ============================================
  # CMS FRONTEND - Next.js
  # ============================================
  cms:
    build:
      context: ./tbs-cms-frontend
      dockerfile: Dockerfile
      target: production
    container_name: tbs_cms_frontend
    restart: unless-stopped
    ports:
      - '${CMS_PORT:-3002}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_CMS_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TBS ERP}
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tbs_network

  # ============================================
  # NGINX - Reverse Proxy + SSL
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: tbs_erp_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - cms
      - backend
    networks:
      - tbs_network
    # Reload nginx config every 6 hours (for cert renewal)
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # ============================================
  # CERTBOT - SSL Certificate Management
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: tbs_erp_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renew certificates every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ============================================
  # MONITORING - Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: tbs_erp_prometheus
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network

  # ============================================
  # MONITORING - Grafana
  # ============================================
  grafana:
    image: grafana/grafana:10.3.0
    container_name: tbs_erp_grafana
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3003}:3000'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tbs_network

  # ============================================
  # MONITORING - PostgreSQL Exporter
  # ============================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tbs_erp_pg_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-tbs_user}:${POSTGRES_PASSWORD:-tbs_password}@postgres:5432/${POSTGRES_DB:-tbs_erp}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbs_network

  # ============================================
  # MONITORING - Redis Exporter
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.56.0
    container_name: tbs_erp_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tbs_network

  # ============================================
  # MONITORING - Nginx Exporter
  # ============================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: tbs_erp_nginx_exporter
    restart: unless-stopped
    command: ['--nginx.scrape-uri=http://nginx:8080/stub_status']
    depends_on:
      - nginx
    networks:
      - tbs_network

  # ============================================
  # ELK STACK - Elasticsearch
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: tbs_erp_elasticsearch
    restart: unless-stopped
    ports:
      - '${ELASTICSEARCH_PORT:-9200}:9200'
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - cluster.name=tbs-erp-logs
    volumes:
      - ./monitoring/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tbs_network

  # ============================================
  # ELK STACK - Logstash
  # ============================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: tbs_erp_logstash
    restart: unless-stopped
    ports:
      - '${LOGSTASH_PORT:-5000}:5000'
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tbs_network

  # ============================================
  # ELK STACK - Kibana
  # ============================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: tbs_erp_kibana
    restart: unless-stopped
    ports:
      - '${KIBANA_PORT:-5601}:5601'
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      # The var must be defined so kibana.yml does not receive an empty string
      # that triggers a Kibana startup error.
      # SECURITY: Set ELASTICSEARCH_PASSWORD in your .env file before deploying.
      ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD in .env}"
    volumes:
      - ./monitoring/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tbs_network

# ============================================
# NETWORKS
# ============================================
networks:
  tbs_network:
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  pgdata:
    name: tbs_erp_pgdata
  redisdata:
    name: tbs_erp_redisdata
  backend_logs:
    name: tbs_erp_backend_logs
  certbot_conf:
    name: tbs_erp_certbot_conf
  certbot_www:
    name: tbs_erp_certbot_www
  nginx_logs:
    name: tbs_erp_nginx_logs
  prometheus_data:
    name: tbs_erp_prometheus_data
  grafana_data:
    name: tbs_erp_grafana_data
  elasticsearch_data:
    name: tbs_erp_elasticsearch_data
